---
# Continuous deployment: each push to main runs ci's jobs (the reusable
# ci.yml), then deploys to stg, then prd. Each deploy job loads its
# environment's variables from that environment's 1Password Environment
# through Workload Identity; the GitHub environments admit only main.
# worker_deploy tests each new version at 0% and again after it takes
# traffic, and puts the previous version back when a test fails, so a
# failed stg deploy never reaches prd.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Runs queue in push order, and a newer push replaces a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    # The pinned actionlint rejects zizmor's suggested `$/` form.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  stg:
    name: stg
    needs: ci
    runs-on: ubuntu-26.04
    environment: stg
    # A cancelled deploy tries to put the previous version back, but the
    # runner may stop it first; let a deploy finish, within its own
    # timeouts (wrangler 10 min a call, each check 5 min).
    timeout-minutes: 45
    concurrency:
      group: deploy-stg
      cancel-in-progress: false
    permissions:
      contents: read  # checkout and the main-tip lookup
      id-token: write  # Workload Identity: OIDC token for 1Password access
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps: &deploy
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      # A re-run of an older push must not deploy over a newer one.
      - name: Check that this is still main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          if [[ "${tip}" != "${SHA}" ]]; then
            echo "::notice::main has moved on to ${tip}; not deploying ${SHA}"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      # An environment's first deploy is a manual bootstrap. Its BOOTSTRAPPED
      # variable is set to true after it; until then the job skips.
      - name: Skip until the environment's bootstrap deploy
        if: steps.tip.outputs.current == 'true' && vars.BOOTSTRAPPED != 'true'
        env:
          DEPLOY_ENV: ${{ github.job }}
        run: echo "::notice::${DEPLOY_ENV} isn't bootstrapped yet (vars.BOOTSTRAPPED); skipping"

      - name: Checkout
        if: steps.tip.outputs.current == 'true' && vars.BOOTSTRAPPED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        if: steps.tip.outputs.current == 'true' && vars.BOOTSTRAPPED == 'true'
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ci
          repository-cache: true
          cache-save: false

      # Everything is fetched and built before any secret is loaded, so no
      # repository rule or build action runs with them.
      - name: Build the deploy
        if: steps.tip.outputs.current == 'true' && vars.BOOTSTRAPPED == 'true'
        env:
          DEPLOY_ENV: ${{ github.job }}
        run: bazelisk build --config=ci "//:deploy_${DEPLOY_ENV}"

      # Every variable in the environment's 1Password Environment, as this
      # step's outputs only: no other step's environment gets them. Renovate
      # has no manager for the 1Password CLI version; bump it by hand.
      - name: Load the environment's secrets
        id: secrets
        if: steps.tip.outputs.current == 'true' && vars.BOOTSTRAPPED == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: false
          version: 2.41.1
        env:
          OP_WORKLOAD_ID: ${{ secrets.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Deploy and test
        id: deploy
        if: steps.tip.outputs.current == 'true' && vars.BOOTSTRAPPED == 'true'
        env:
          DEPLOY_ENV: ${{ github.job }}
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.secrets.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bazelisk run --config=ci "//:deploy_${DEPLOY_ENV}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Summarize a failed deploy
        if: failure() && steps.deploy.conclusion == 'failure'
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          PREVIOUS: ${{ steps.deploy.outputs.previous-version-id }}
        run: |
          echo "Deploy result: ${RESULT:-none}; previous version: ${PREVIOUS:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  prd:
    name: prd
    needs: stg
    if: needs.stg.outputs.deployed == 'true'
    runs-on: ubuntu-26.04
    environment: prd
    timeout-minutes: 45
    concurrency:
      group: deploy-prd
      cancel-in-progress: false
    permissions:
      contents: read  # checkout and the main-tip lookup
      id-token: write  # Workload Identity: OIDC token for 1Password access
    steps: *deploy
