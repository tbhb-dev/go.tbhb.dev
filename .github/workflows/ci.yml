---
# Main quality gate. Bazel pins the tools and owns the gates: the hermetic
# checks are cached `bazel test` targets, so `bazel test //...` runs them
# all, and the few that need the network, Git history or the GitHub API run
# as their own steps after it. A final `conclusion` job gives branch
# protection one stable required check.
name: ci

# On main, the deploy workflow runs these same jobs before it deploys,
# rather than reacting to this workflow's result.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux alone: the
  # Worker runs on Cloudflare's Linux-based runtime, so no other OS adds
  # coverage. The checks that need the network or GitHub's API run in the
  # repo job.
  bazel:
    name: bazel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Hardens the runner, sets up Bazel with its caches, and fetches
      # //... with retries; see rules' .github/actions/README.md.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@b3262bfff7711c7327a240592d9b9345a800584a  # main
        with:
          disk-cache: ci
          cache-save: ${{ github.event_name != 'pull_request' }}

      # //... covers the @tbhb_rules lint, format, shell and docs tests over
      # the whole tree, the buildifier_test, and the preset.update_test that
      # fails when preset.bazelrc is stale.
      - name: Test
        run: bazelisk test --config=ci //...

      # A failed run's test logs, so a failure that does not recur can still
      # be read. The links are dot-prefixed, which upload-artifact skips
      # unless told otherwise.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          include-hidden-files: true
          if-no-files-found: ignore

  # The repository-level checks, beside the bazel job, so they don't wait
  # behind the tests: MODULE.bazel tidiness, the Git history secret scan,
  # the Python dependency audit, zizmor's online audits and the CODEOWNERS
  # owner check. The Worker imports no npm package, so there is no pnpm
  # audit, and there is no Go to scan or gazelle to check.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@b3262bfff7711c7327a240592d9b9345a800584a  # main
    with:
      runs-on: ubuntu-24.04
      timeout-minutes: 25
      module-dirs: .

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed, and it passes only when every needed
  # job's result is exactly "success".
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@b3262bfff7711c7327a240592d9b9345a800584a  # main
        with:
          needs: ${{ toJSON(needs) }}
